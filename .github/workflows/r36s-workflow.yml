
name: Mega Man X - R36S-DARKOSRE PortMaster Auto Install

on:
  workflow_dispatch:
    inputs:
      optimization_level:
        description: "A53 optimization level (compare O2 and O3 on the handheld)"
        required: true
        type: choice
        default: O3
        options:
          - O3
          - O2

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted ARM64 runner; all build steps execute inside Ubuntu 20.04 ARM64.
    runs-on: ubuntu-24.04-arm

    container:
      image: ubuntu:20.04

    steps:
      # The base Ubuntu container is minimal. Install git before checkout actions run.
      - name: Bootstrap Ubuntu 20.04 container
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            git-lfs
          git lfs install

      - name: Checkout MMX Recomp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Ubuntu 20.04 ARM64 build environment
        run: |
          set -e
          test "$(uname -m)" = "aarch64"
          grep -q 'VERSION_ID="20.04"' /etc/os-release
          uname -a
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          test "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" = "2.31"

      - name: Install dependencies
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential \
            ninja-build \
            git \
            pkg-config \
            curl \
            ca-certificates \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            binutils \
            zip \
            unzip

          # Keep Ubuntu 20.04 / glibc 2.31 while replacing its obsolete
          # Python 3.8.10 build interpreter with an isolated Python 3.11.
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          uv venv --python 3.11 /opt/py311
          export UV_LINK_MODE=copy
          uv pip install --python /opt/py311/bin/python \
            cmake==3.31.10 pillow

          # Later steps resolve python3, pip and cmake from this environment.
          echo "/opt/py311/bin" >> "$GITHUB_PATH"
          export PATH="/opt/py311/bin:$PATH"
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9)'
          cmake --version
          cmake --version | grep -Eq '^cmake version 3\.(2[0-9]|[3-9][0-9])'

      # Build SDL2 2.32.8 as a static library. This embeds SDL2 in the
      # game executable, avoiding the old Ubuntu 20.04 SDL2 runtime dependency.
      - name: Build and install static SDL2
        run: |
          set -e
          git clone --depth 1 --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git sdl2-src
          cmake -S sdl2-src -B sdl2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl2-static \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_INSTALL=ON
          cmake --build sdl2-build --parallel 4
          cmake --install sdl2-build
          test -f /opt/sdl2-static/include/SDL2/SDL.h
          find /opt/sdl2-static -name 'libSDL2.a' -print -quit | grep -q .
          echo "CMAKE_PREFIX_PATH=/opt/sdl2-static" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/sdl2-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SDL2 static library installed."

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Enable SDL2 GLES2
        run: |
          bash tools/enable-sdl-opengles2.sh

      - name: Checkout private ROM repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ROM_REPO }}
          token: ${{ secrets.ROM_TOKEN }}
          path: private-roms
          lfs: true
          persist-credentials: false

      - name: Validate ROM and GPTK
        run: |
          set -e

          test -f "private-roms/Mega Man X (USA) (Rev 1).sfc"

          test -f "controls/megamanx.gptk" || {
            echo "megamanx.gptk is missing from the repository."
            exit 1
          }

      - name: Build A53 optimized GLES2 executable
        env:
          OPT_LEVEL: ${{ inputs.optimization_level }}
        run: |
          set -e

          case "$OPT_LEVEL" in
            O2|O3) ;;
            *) echo "Unsupported optimization level: $OPT_LEVEL"; exit 1 ;;
          esac

          export CFLAGS="-${OPT_LEVEL} -mcpu=cortex-a53 -flto -ffast-math -fno-math-errno -fno-semantic-interposition -fomit-frame-pointer"
          export CXXFLAGS="-${OPT_LEVEL} -mcpu=cortex-a53 -flto -ffast-math -fno-math-errno -fno-semantic-interposition -fomit-frame-pointer"
          export LDFLAGS="-flto"

          bash tools/build-linux-dev.sh \
            --rom "private-roms/Mega Man X (USA) (Rev 1).sfc" \
            --sdl SDL2 \
            --fresh \
            --jobs 4 \
            --build-dir build-r36s \
            -- \
            -DSNESRECOMP_SDL_GLES2_ONLY=ON \
            -DMMX_RASTER_IMPL=NATIVE \
            -DMMX_NATIVE_ROW_PLAN=ON \
            -DMMX_NATIVE_BG_SPANS=ON \
            -DMMX_STAGE_TILE_REUSE=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Test native A53 renderer optimizations
        run: |
          set -e
          cmake --build build-r36s \
            --target mmx_renderer_native_test mmx_row_plan_test \
            --parallel 4
          ctest --test-dir build-r36s \
            -R 'mmx_custom_renderer_native|mmx_custom_renderer_row_plan' \
            --output-on-failure

      - name: Verify executable
        run: |
          set -e

          test -f build-r36s/MegaManXSNESRecomp

          readelf -d build-r36s/MegaManXSNESRecomp \
            | tee dependencies.txt

          if grep -E 'libOpenGL|libGLX|libGLU' dependencies.txt; then
            echo "Unexpected desktop OpenGL dependency."
            exit 1
          fi

          if grep -E 'libSDL2(-2\.0)?\.so' dependencies.txt; then
            echo "SDL2 was dynamically linked; expected the static SDL2 archive."
            exit 1
          fi

          echo "Verified SDL2 is statically linked into the executable."

      - name: Prepare PortMaster package
        run: |
          set -e

          mkdir -p package/ports/megamanx

          cp build-r36s/MegaManXSNESRecomp \
            package/ports/megamanx/MegaManXSNESRecomp

          cp controls/megamanx.gptk \
            package/ports/megamanx/megamanx.gptk

          chmod +x package/ports/megamanx/MegaManXSNESRecomp

      - name: Create PortMaster launcher
        run: |
          cat > package/ports/megamanx.sh <<'EOF'
          #!/bin/bash

          PORTNAME="Mega Man X"
          PORTDIR="/$directory/megamanx"
          GAMEDIR="/userdata/roms/ports/megamanx"

          cd "$GAMEDIR" || exit 1

          export LD_LIBRARY_PATH="$GAMEDIR/libs:$LD_LIBRARY_PATH"

          get_controls

          ./MegaManXSNESRecomp

          exit 0
          EOF

          chmod +x package/ports/megamanx.sh

      - name: Package PortMaster installation
        run: |
          set -e

          cd package

          zip -r ../MegaManX-R36S-DARKOSRE-PortMaster.zip \
            ports/megamanx.sh \
            ports/megamanx/

      - name: Verify no standalone SNES ROM is included
        run: |
          set -e

          if unzip -Z1 MegaManX-R36S-DARKOSRE-PortMaster.zip \
            | grep -Ei '\.(sfc|smc)$'; then
            echo "ROM detected in package!"
            exit 1
          fi

          unzip -l MegaManX-R36S-DARKOSRE-PortMaster.zip

      - name: Upload PortMaster package
        uses: actions/upload-artifact@v4
        with:
          name: MegaManX-R36S-DARKOSRE-PortMaster
          path: MegaManX-R36S-DARKOSRE-PortMaster.zip
          retention-days: 14
          
