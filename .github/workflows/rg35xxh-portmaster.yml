name: RG35XX-H PortMaster auto-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rg35xx-h:
    # Native ARM64 build: no cross-compiler ABI surprises.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          ref: sdl-opengles2
          submodules: recursive

      - name: Check out private ROM repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.ROM_REPO }}
          token: ${{ secrets.ROM_TOKEN }}
          path: private-roms
          persist-credentials: false

      - name: Validate ROM inputs
        shell: bash
        run: |
          set -euo pipefail
          for rom in \
            "Mega Man X (USA) (Rev 1).sfc" \
            "Mega Man X 2 (USA).sfc" \
            "Mega Man X 3 (USA).sfc"; do
            test -s "private-roms/$rom" || {
              echo "::error::Missing private ROM file: $rom"
              exit 1
            }
          done

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            python3 python3-pip python3-pil \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev

      - name: Install Rust analyzer toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify SDL2 GLES2 framework path
        run: |
          bash tools/enable-sdl-opengles2.sh

      - name: Build ARM64 Cortex-A53 executable
        env:
          SNESRECOMP_ANALYSIS_BACKEND: native
        run: |
          bash tools/build-linux-dev.sh \
            --rom "private-roms/Mega Man X (USA) (Rev 1).sfc" \
            --sdl SDL2 --fresh --jobs 4 \
            --build-dir build-rg35xxh \
            -- \
            -DSNESRECOMP_SDL_GLES2_ONLY=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-flto" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Assemble PortMaster auto-install folder
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/MegaManXSNESRecomp"
          mkdir -p "$PKG/roms/assets" "$PKG/userdata"

          install -m 755 build-rg35xxh/MegaManXSNESRecomp "$PKG/MegaManXSNESRecomp"
          install -m 644 config.ini "$PKG/config.ini"
          install -m 644 logging.ini "$PKG/logging.ini"

          # All three game ROMs live in the install's roms/ directory.
          install -m 644 "private-roms/Mega Man X (USA) (Rev 1).sfc" "$PKG/roms/"
          install -m 644 "private-roms/Mega Man X 2 (USA).sfc" "$PKG/roms/"
          install -m 644 "private-roms/Mega Man X 3 (USA).sfc" "$PKG/roms/"

          # Ship the project's external runtime art/audio assets under roms/assets.
          if [ -d assets ]; then
            cp -a assets/. "$PKG/roms/assets/"
          fi

          # Stage the project's actual preloaded mod catalog beside the executable.
          # The launcher reads it from mods/preloaded/packages.
          test -d build-rg35xxh/mods/preloaded/packages || {
            echo "::error::Build did not stage the mod catalog"
            exit 1
          }
          mkdir -p "$PKG/mods/preloaded"
          cp -a build-rg35xxh/mods/preloaded/packages "$PKG/mods/preloaded/"

          # Preselect the private X2/X3 donor ROMs for the mod resource pickers.
          # X3 is shared by Zero, co-op and X3 weapons; X2 feeds X2 weapons.
          cat > "$PKG/mods/preloaded/state.toml" <<'STATE'
          format_version = 1

          [[shared_resource]]
          id = "megaman-x.source.x2"
          path = "roms/Mega Man X 2 (USA).sfc"

          [[shared_resource]]
          id = "megaman-x.source.x3"
          path = "roms/Mega Man X 3 (USA).sfc"
          STATE

          # The game/recompiler expects the verified X1 image at mmx.sfc.
          ln -s "roms/Mega Man X (USA) (Rev 1).sfc" "$PKG/mmx.sfc"

          # Runtime looks for project art relative to the application directory.
          ln -s "roms/assets" "$PKG/assets"

          cat > "$PKG/MegaManXSNESRecomp.sh" <<'LAUNCHER'
          #!/bin/bash
          set -euo pipefail

          export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
          if [ -d "/opt/system/Tools/PortMaster" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster" ]; then
              controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
          else
              controlfolder="/roms/ports/PortMaster"
          fi

          if [ ! -r "$controlfolder/control.txt" ]; then
              echo "PortMaster control.txt not found: $controlfolder/control.txt" >&2
              exit 1
          fi
          source "$controlfolder/control.txt"
          if [ -f "$controlfolder/mod_${CFW_NAME}.txt" ]; then
              source "$controlfolder/mod_${CFW_NAME}.txt"
          fi
          get_controls

          GAMEDIR="$(cd "$(dirname "$0")" && pwd)"
          GAME="$GAMEDIR/MegaManXSNESRecomp"
          LOGFILE="$GAMEDIR/log.txt"
          mkdir -p "$GAMEDIR/userdata"
          cd "$GAMEDIR"

          if [ -d "$GAMEDIR/libs" ]; then
              export LD_LIBRARY_PATH="$GAMEDIR/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          export SDL_RENDER_DRIVER=opengles2

          GPTOKEYB_PID=""
          finish_portmaster() {
              if [ -n "$GPTOKEYB_PID" ]; then
                  kill "$GPTOKEYB_PID" 2>/dev/null || true
                  wait "$GPTOKEYB_PID" 2>/dev/null || true
              fi
              pm_finish
          }
          trap finish_portmaster EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [ ! -x "$GAME" ]; then
              pm_show_error "Mega Man X Recompiled executable is missing. Reinstall the port."
              exit 1
          fi

          pm_platform_helper "$GAME" >/dev/null 2>&1 || true
          echo "[launcher] Mega Man X Recompiled starting on $(uname -m)" > "$LOGFILE"
          echo "[launcher] SDL renderer requested: opengles2" >> "$LOGFILE"
          "$GAME" >> "$LOGFILE" 2>&1
          GAME_STATUS=$?
          exit "$GAME_STATUS"
          LAUNCHER
          chmod 755 "$PKG/MegaManXSNESRecomp.sh"

          cat > "$PKG/README.txt" <<'README'
          Mega Man X Recompiled - RG35XX-H / KNULLI
          Install the MegaManXSNESRecomp folder under /roms/ports/.
          Launch MegaManXSNESRecomp.sh from PortMaster.
          The three ROMs are in roms/ and project assets are in roms/assets/.
          X2 and X3 are preselected as donor ROMs for the corresponding Mods
          source pickers; enable the desired X2/X3 weapon features in Mods.
          X3 is shared by Zero, co-op and X3 weapons.
          SDL2 is configured to request OpenGL ES 2. This build does not use
          GL4ES or the desktop OpenGL/KMS/DRM presenter.
          README

          cd dist
          zip -qr MegaManXSNESRecomp-RG35XX-H-PortMaster.zip MegaManXSNESRecomp

      - name: Upload PortMaster auto-install package
        uses: actions/upload-artifact@v6
        with:
          name: MegaManXSNESRecomp-RG35XX-H-PortMaster
          path: dist/MegaManXSNESRecomp-RG35XX-H-PortMaster.zip
          if-no-files-found: error
          retention-days: 14
