name: RG35XX-H PortMaster auto-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rg35xxh:
    # Native ARM64 build: no cross-compiler ABI surprises.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          ref: sdl-opengles2
          submodules: recursive

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/build-linux-dev.sh
          bash -n tools/enable-sdl-opengles2.sh

      - name: Check out PortMaster package files
        uses: actions/checkout@v6
        with:
          repository: CrispyBuns/RHH-Ports
          ref: main
          path: port-files

      - name: Check out private ROM repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.ROM_REPO }}
          token: ${{ secrets.ROM_TOKEN }}
          path: private-roms
          lfs: true
          persist-credentials: false

      - name: Validate X1 ROM input
        shell: bash
        run: |
          set -euo pipefail
          test -s "private-roms/Mega Man X (USA) (Rev 1).sfc" || {
            echo "::error::Missing X1 ROM: Mega Man X (USA) (Rev 1).sfc"
            exit 1
          }

      - name: Detect X2 and X3 donor ROMs by content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("private-roms")
          expected = {
              "X2": "f3246755f608a1e1dc9c848b61da3b824c7853b29b3be40df6fc7f2793a887ed",
              "X3": "65b03268afac296330e8ff8d60dd0825879e13ed658b37713c034a3bd074f1d7",
          }
          matches = {game: [] for game in expected}
          diagnostics = []

          for path in root.rglob("*"):
              if ".git" in path.parts or not path.is_file() or path.is_symlink():
                  continue
              try:
                  size = path.stat().st_size
                  # SNES images are small; skip metadata and unrelated large assets.
                  if size < 512 or size > 8 * 1024 * 1024:
                      continue
                  data = path.read_bytes()
                  raw_hash = hashlib.sha256(data).hexdigest()
                  stripped_hash = (
                      hashlib.sha256(data[512:]).hexdigest()
                      if size > 512 else ""
                  )
                  rel = path.relative_to(root).as_posix()
                  diagnostics.append((rel, size, raw_hash, stripped_hash))
                  for game, wanted in expected.items():
                      # Check the exact file and a possible 512-byte copier-header removal.
                      if raw_hash == wanted or stripped_hash == wanted:
                          matches[game].append(rel)
              except OSError as exc:
                  raise SystemExit(f"::error::Could not inspect {path}: {exc}")

          for game, found in matches.items():
              if len(found) != 1:
                  if not found:
                      print(f"::error::Could not identify Mega Man {game} by SHA-256.")
                      print("Candidate files inspected (path | size | raw SHA-256 | SHA-256 after 512-byte strip):")
                      for rel, size, raw_hash, stripped_hash in diagnostics:
                          print(f"  {rel} | {size} | {raw_hash} | {stripped_hash}")
                      raise SystemExit(
                          f"Add the correct ROM to the private repository. "
                          f"Expected checksum: {expected[game]}"
                      )
                  raise SystemExit(
                      f"::error::Found multiple matching Mega Man {game} ROMs: {found}. "
                      "Keep exactly one matching copy in the private ROM repository."
                  )
              print(f"Detected Mega Man {game}: {found[0]}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"{game}_ROM_REL={found[0]}" + chr(10))
          PY

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            python3 python3-pip python3-pil \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Install Rust analyzer toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify SDL2 GLES2 framework path
        run: |
          bash tools/enable-sdl-opengles2.sh

      - name: Build ARM64 Cortex-A53 executable
        env:
          SNESRECOMP_ANALYSIS_BACKEND: native
        run: |
          bash tools/build-linux-dev.sh \
            --rom "private-roms/Mega Man X (USA) (Rev 1).sfc" \
            --sdl SDL2 --fresh --jobs 4 \
            --build-dir build-rg35xxh \
            -- \
            -DSNESRECOMP_SDL_GLES2_ONLY=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-flto" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Verify GLES2-only executable (reject desktop OpenGL)
        shell: bash
        run: |
          set -euo pipefail
          BIN="build-rg35xxh/MegaManXSNESRecomp"
          CACHE="build-rg35xxh/CMakeCache.txt"

          grep -Fxq 'SNESRECOMP_SDL_GLES2_ONLY:BOOL=ON' "$CACHE" || {
            echo "::error::CMake did not enable strict SDL2/GLES2-only mode"
            exit 1
          }

          if readelf -d "$BIN" | grep -E '\(NEEDED\).*\[(lib(OpenGL|GL|GLX|GLU)\.so(\.[0-9]+)?)\]'; then
            echo "::error::The handheld executable still links desktop OpenGL"
            exit 1
          fi

          grep -Fq 'recomp-ui: SDL2 OpenGL ES 2 backend; desktop OpenGL disabled' \
            build-rg35xxh/configure.log || {
              echo "::error::recomp-ui did not configure its GLES2 backend"
              exit 1
            }

          echo "Verified: strict SDL2 opengles2 host; no desktop GL NEEDED entries."
          readelf -d "$BIN" | grep NEEDED || true

      - name: Assemble PortMaster auto-install package (root launcher + payload folder)
        shell: bash
        run: |
          set -euo pipefail

          # Match the working Rusty/RHH-Ports structure:
          # /roms/ports/Mega Man X Recompiled.sh
          # /roms/ports/megamanx-snes-recomp/<game files>
          PKG="dist"
          PORTDIR="$PKG/megamanx-snes-recomp"
          ZIP="$GITHUB_WORKSPACE/dist/MegaManXSNESRecomp-RG35XX-H-PortMaster.zip"
          rm -rf "$PKG"
          mkdir -p "$PORTDIR/roms/assets" "$PORTDIR/userdata" "$PORTDIR/mods/preloaded"

          install -m 755 build-rg35xxh/MegaManXSNESRecomp "$PORTDIR/MegaManXSNESRecomp"
          install -m 644 config.ini "$PORTDIR/config.ini"
          install -m 644 logging.ini "$PORTDIR/logging.ini"

          # X1 is at roms/; detected X2/X3 donor paths are preserved under roms/.
          install -m 644 "private-roms/Mega Man X (USA) (Rev 1).sfc" "$PORTDIR/roms/"
          install -D -m 644 "private-roms/$X2_ROM_REL" "$PORTDIR/roms/$X2_ROM_REL"
          install -D -m 644 "private-roms/$X3_ROM_REL" "$PORTDIR/roms/$X3_ROM_REL"

          # Project runtime art/audio assets live in roms/assets/.
          if [ -d assets ]; then
            cp -a assets/. "$PORTDIR/roms/assets/"
          fi

          # Preloaded mod catalog expected by the game.
          test -d build-rg35xxh/mods/preloaded/packages || {
            echo "::error::Build did not stage the mod catalog"
            exit 1
          }
          cp -a build-rg35xxh/mods/preloaded/packages "$PORTDIR/mods/preloaded/"

          # Preselect the content-identified X2/X3 donor ROMs for the mod pickers.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          x2 = "roms/" + os.environ["X2_ROM_REL"]
          x3 = "roms/" + os.environ["X3_ROM_REL"]
          state = (
              "format_version = 1\n\n"
              "[[shared_resource]]\n"
              'id = "megaman-x.source.x2"\n'
              f"path = {json.dumps(x2)}\n\n"
              "[[shared_resource]]\n"
              'id = "megaman-x.source.x3"\n'
              f"path = {json.dumps(x3)}\n"
          )
          Path("dist/megamanx-snes-recomp/mods/preloaded/state.toml").write_text(
              state, encoding="utf-8"
          )
          PY

          # Runtime paths expected by the recomp.
          ln -s "roms/Mega Man X (USA) (Rev 1).sfc" "$PORTDIR/mmx.sfc"
          ln -s "roms/assets" "$PORTDIR/assets"

          # Use the established RHH-Ports launcher at the ZIP root.
          install -m 755 "port-files/ports/unreleased/megamanx-snes-recomp/Mega Man X Recompiled.sh" \
            "$PKG/Mega Man X Recompiled.sh"
          install -m 644 "port-files/ports/unreleased/megamanx-snes-recomp/port.json" \
            "$PKG/port.json"

          # Request GLES2 explicitly in the packaged launcher.
          python3 - <<'PY'
          from pathlib import Path
          launcher = Path("dist/Mega Man X Recompiled.sh")
          source = launcher.read_text(encoding="utf-8")
          needle = 'export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"'
          replacement = 'export SDL_RENDER_DRIVER=opengles2\n' + needle
          if needle not in source:
              raise SystemExit("Could not locate SDL controller environment setup in PortMaster launcher")
          launcher.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
          PY
          bash -n "$PKG/Mega Man X Recompiled.sh"

          cat > "$PORTDIR/README.txt" <<'README'
          Mega Man X Recompiled - RG35XX-H / KNULLI

          Install this ZIP with PortMaster/HarbourMaster. The launcher
          "Mega Man X Recompiled.sh" is placed directly in /roms/ports/.
          The game payload is placed in /roms/ports/megamanx-snes-recomp/.

          The three ROMs are in megamanx-snes-recomp/roms/ and project assets
          are in megamanx-snes-recomp/roms/assets/.
          X2 and X3 are preselected as donor ROMs for the corresponding Mods
          source pickers; enable the desired X2/X3 weapon features in Mods.
          X3 is shared by Zero, co-op and X3 weapons.

          SDL2 requests OpenGL ES 2. This build does not use GL4ES or the
          desktop OpenGL/KMS/DRM presenter.
          README

          # Assert the on-device paths before creating the ZIP.
          test -x "$PKG/Mega Man X Recompiled.sh"
          test -s "$PORTDIR/MegaManXSNESRecomp"
          test -s "$PORTDIR/roms/Mega Man X (USA) (Rev 1).sfc"
          test -s "$PORTDIR/roms/$X2_ROM_REL"
          test -s "$PORTDIR/roms/$X3_ROM_REL"
          test -s "$PORTDIR/mods/preloaded/state.toml"
          test -L "$PORTDIR/mmx.sfc"
          test -L "$PORTDIR/assets"
          test -f "$PKG/port.json"
          test ! -e "$PORTDIR/Mega Man X Recompiled.sh"

          echo "PortMaster install layout:"
          find "$PKG" -maxdepth 4 -printf '%y %p\n' | sort

          cd "$PKG"
          zip -qr "$ZIP" "Mega Man X Recompiled.sh" port.json megamanx-snes-recomp

          # Validate archive paths: launcher and port.json at ZIP root,
          # executable and resources one level below in the lowercase payload.
          python3 - "$ZIP" <<'PY'
          import sys
          from zipfile import ZipFile

          archive = sys.argv[1]
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
          required = {
              "Mega Man X Recompiled.sh",
              "port.json",
              "megamanx-snes-recomp/MegaManXSNESRecomp",
              "megamanx-snes-recomp/config.ini",
              "megamanx-snes-recomp/logging.ini",
              "megamanx-snes-recomp/roms/Mega Man X (USA) (Rev 1).sfc",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Archive is missing required paths: {missing}")
          if any(name.startswith("MegaManXSNESRecomp/") for name in names):
              raise SystemExit("Unexpected nested MegaManXSNESRecomp/ directory in archive")
          if "megamanx-snes-recomp/Mega Man X Recompiled.sh" in names:
              raise SystemExit("Launcher is incorrectly nested inside the payload directory")
          print("Verified ZIP layout: root launcher + root port.json + megamanx-snes-recomp/ payload")
          PY

          unzip -l "$ZIP"

      - name: Upload PortMaster auto-install package
        uses: actions/upload-artifact@v6
        with:
          name: MegaManXSNESRecomp-RG35XX-H-PortMaster
          path: dist/MegaManXSNESRecomp-RG35XX-H-PortMaster.zip
          if-no-files-found: error
          retention-days: 14
