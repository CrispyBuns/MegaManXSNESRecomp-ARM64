name: RG35XX-H PortMaster auto-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rg35xx-h:
    # Native ARM64 build: no cross-compiler ABI surprises.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          ref: sdl-opengles2
          submodules: recursive

      - name: Check out private ROM repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.ROM_REPO }}
          token: ${{ secrets.ROM_TOKEN }}
          path: private-roms
          persist-credentials: false

      - name: Validate ROM inputs
        shell: bash
        run: |
          set -euo pipefail
          for rom in \
            "Mega Man X (USA) (Rev 1).sfc" \
            "Mega Man X 2 (USA).sfc" \
            "Mega Man X 3 (USA).sfc"; do
            test -s "private-roms/$rom" || {
              echo "::error::Missing private ROM file: $rom"
              exit 1
            }
          done

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            python3 python3-pip python3-pil \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev

      - name: Install Rust analyzer toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Patch SDL2 to require OpenGL ES 2
        run: |
          bash tools/enable-sdl-opengles2.sh

      - name: Build ARM64 Cortex-A53 executable
        env:
          SNESRECOMP_ANALYSIS_BACKEND: native
        run: |
          bash tools/build-linux-dev.sh \
            --rom "private-roms/Mega Man X (USA) (Rev 1).sfc" \
            --sdl SDL2 --fresh --jobs 4 \
            --build-dir build-rg35xxh \
            -- \
            -DSNESRECOMP_SDL_GLES_ONLY=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -mcpu=cortex-a53 -flto -fno-math-errno" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-flto" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Assemble PortMaster auto-install folder
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/MegaManXSNESRecomp"
          mkdir -p "$PKG/roms/assets" "$PKG/userdata"

          install -m 755 build-rg35xxh/MegaManXSNESRecomp "$PKG/MegaManXSNESRecomp"
          install -m 644 config.ini "$PKG/config.ini"
          install -m 644 logging.ini "$PKG/logging.ini"

          # All three game ROMs live in the install's roms/ directory.
          install -m 644 "private-roms/Mega Man X (USA) (Rev 1).sfc" "$PKG/roms/"
          install -m 644 "private-roms/Mega Man X 2 (USA).sfc" "$PKG/roms/"
          install -m 644 "private-roms/Mega Man X 3 (USA).sfc" "$PKG/roms/"

          # Ship the project's external runtime art/audio assets under roms/assets.
          if [ -d assets ]; then
            cp -a assets/. "$PKG/roms/assets/"
          fi

          # The game/recompiler expects the verified X1 image at mmx.sfc.
          ln -s "roms/Mega Man X (USA) (Rev 1).sfc" "$PKG/mmx.sfc"

          cat > "$PKG/MegaManXSNESRecomp.sh" <<'LAUNCHER'
          #!/bin/bash
          set -euo pipefail
          GAMEDIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$GAMEDIR"
          mkdir -p "$GAMEDIR/userdata"
          export HOME="$GAMEDIR/userdata"
          export XDG_CONFIG_HOME="$GAMEDIR/userdata"
          export SDL_RENDER_DRIVER=opengles2
          export LD_LIBRARY_PATH="$GAMEDIR/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          LOG="$GAMEDIR/log.txt"
          echo "[launcher] Mega Man X Recompiled starting on $(uname -m)" > "$LOG"
          echo "[launcher] SDL renderer requested: opengles2" >> "$LOG"
          exec "$GAMEDIR/MegaManXSNESRecomp" >> "$LOG" 2>&1
          LAUNCHER
          chmod 755 "$PKG/MegaManXSNESRecomp.sh"

          cat > "$PKG/README.txt" <<'README'
          Mega Man X Recompiled - RG35XX-H / KNULLI
          Copy the MegaManXSNESRecomp folder into /roms/ports/.
          Launch MegaManXSNESRecomp.sh from PortMaster.
          ROMs are in roms/ and project assets are in roms/assets/.
          The build requests SDL2's OpenGL ES 2 renderer and does not use GL4ES
          or directly link the desktop OpenGL/KMS/DRM presenter.
          README

          # Include an explicit package manifest for the install archive.
          cat > "$PKG/port.json" <<'PORT'
          {
            "version": 1,
            "name": "Mega Man X Recompiled",
            "items": [
              "MegaManXSNESRecomp.sh",
              "MegaManXSNESRecomp",
              "config.ini",
              "logging.ini",
              "roms/",
              "userdata/"
            ]
          }
          PORT

          cd dist
          zip -qr MegaManXSNESRecomp-RG35XX-H-PortMaster.zip MegaManXSNESRecomp

      - name: Upload PortMaster auto-install package
        uses: actions/upload-artifact@v6
        with:
          name: MegaManXSNESRecomp-RG35XX-H-PortMaster
          path: dist/MegaManXSNESRecomp-RG35XX-H-PortMaster.zip
          if-no-files-found: error
          retention-days: 14
